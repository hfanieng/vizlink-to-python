<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meine Website{% endblock %}</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        .column {
            flex: 1;
            padding: 20px;
            display: flex;
        }
        .graphic-placeholder {
            background-color: #333;
            width: 100px;
            height: 100px;
            margin-right: 20px;
        }
        .text-content {
            flex: 1;
        }
        .column:first-child {
            border-right: 1px solid #333;
        }
        @media (max-width: 300px) {
            .column {
                flex: 100%;
                border-right: none;
                border-bottom: 1px solid #333;
                flex-direction: column;
            }
            .graphic-placeholder {
                margin-right: 0;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>{% block header %}Now Playing{% endblock %}</h1>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>© 2024 Meine Website</p>
    </footer>
</body>
</html>
